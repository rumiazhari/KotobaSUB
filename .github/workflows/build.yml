name: Windows build
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build KotobaSUB.slnx -c Release
      - run: dotnet run --project tests/KotobaSUB.Tests -c Release --no-build
